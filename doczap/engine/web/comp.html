<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
import './overlay.js';
window.compFrame = async (f, url, nocap) => { const im = new Image(); im.src = url; await im.decode(); window.SRC = im; window.NOCAP = nocap; window.overlay(f); return document.getElementById('o').toDataURL('image/jpeg', 0.95); };
await document.fonts.load('900 80px Inter'); window.ready = true;
</script></body></html>
